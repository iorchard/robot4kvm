## version=Rocky9
## Rocky Linux 9 Kickstart 
# install mode: text, graphical
text
# cdrom install
cdrom
lang en_US --addsupport=ko_KR
keyboard us
firewall --disabled
selinux --disabled
timezone Asia/Seoul --utc
timesource --ntp-disable
bootloader --timeout=5 --location=mbr --append="net.ifnames=0 biosdevname=0"
skipx
# Partition scheme split into 2 mode - legacy BIOS vs. UEFI
%include /tmp/partition-scheme
%pre --logfile /tmp/ks-pre.log
# Select OS disk
# Should not be removable
# is not less than $MINSIZE GB
# is not more than $MAXSIZE GB
BLOCKDIR="/sys/block"
MINSIZE=1
MAXSIZE=1100
ROOTDRIVE=""
for d in $BLOCKDIR/sd* $BLOCKDIR/nvme*; do
  DEV=$(basename "$d")
  if [ -d $BLOCKDIR/$DEV ]; then
    if [[ "`cat $BLOCKDIR/$DEV/removable`" = "0" ]]; then
      GB=$((`cat $BLOCKDIR/$DEV/size`/2**21))
      echo "Block device $DEV has $GB GB."
      if [ $GB -gt $MINSIZE -a $GB -lt $MAXSIZE ]; then
        ROOTDRIVE=$DEV
        echo "Selected ROOTDRIVE=$ROOTDRIVE"
        break
      fi
    fi
  fi
done

if [ -z "$ROOTDRIVE" ]; then
  echo "ERROR: ROOTDRIVE is not defined."
else
  echo "ROOTDRIVE=$ROOTDRIVE"
  cat > /tmp/partition-scheme <<END
zerombr
clearpart --drives=$ROOTDRIVE --all --initlabel
ignoredisk --only-use=$ROOTDRIVE
END
fi

if [ -d /sys/firmware/efi ]; then
  cat >> /tmp/partition-scheme <<END
part /boot --fstype xfs --size 1024
part /boot/efi --fstype efi --size 500
part / --fstype xfs --size 1 --grow
END
else
  cat >> /tmp/partition-scheme <<END
part biosboot --fstype=biosboot --size 1
part / --fstype xfs --size 1 --grow
END
fi
%end

firstboot --disabled
poweroff
rootpw --iscrypted $6$LrqDgDxJGmfe0EGJ$/nWYPb8puF9WO7GbJA9e1/2Isem7fEXcAOROCan8NWKmALQlWP2ZUJmMEhpnRK4ZllM8ziWrrdtpOGuGWzYPk1
user --name=clex --iscrypted --password $6$uD9VFmfBv97ga7Oz$TPJQRFsl0YxHQaV/ef9NksvEptRnLP1WoWdYOv1CQqj46iiMM5EGv8OjJGQ1f62.QYO7OZtJRHuU8.MxZ9AKW0
%packages --inst-langs=en_US.utf8
openssh-clients
sudo
nfs-utils
tar
rsync
python3
git
sshpass
lsof
wget
jq
patch
gdisk
polkit
python3-libnmstate
python3-pip
rqlite
%end

%post --nochroot
# bcocinero
ISO_PATH="/run/install/repo"
TARGET="/mnt/sysimage"

if [ -d "$ISO_PATH/bcocinero" ]; then
    echo "Copying bcocinero packages..." >> $TARGET/root/ks_post_install.log
    cp -r "$ISO_PATH/bcocinero" "$TARGET/tmp/"
fi
%end
%post
# pwquality
cat > /etc/security/pwquality.conf.d/burrito.conf << EOF
minlen = 8
minclass = 4
maxrepeat = 3
enforce_for_root
EOF
# sudo
echo 'Defaults:clex !requiretty' > /etc/sudoers.d/clex
echo '%clex ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers.d/clex
chmod 440 /etc/sudoers.d/clex
# security settings
sed -i 's/^#UseDNS no/UseDNS no/;s/^PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
echo -e "TMOUT=0\nexport TMOUT" >> /etc/profile

# bcocinero
if [ -d "/tmp/bcocinero" ]; then
    chown -R clex:clex "/tmp/bcocinero"
    echo "Installing bcocinero packages..." >> /root/ks_post_install.log
    su -l clex -c "python3 -m pip install --user --no-index --find-links=/tmp/bcocinero/ bcocinero"
    rm -fr "/tmp/bcocinero"
    echo "Completed bcocinero installation" >> /root/ks_post_install.log
fi
echo "Setting up network manager..." >> /root/ks_post_install.log
cat << 'EOF' > /etc/polkit-1/rules.d/10-network-manager.rules
polkit.addRule(function(action, subject) {
    if (action.id.indexOf("org.freedesktop.NetworkManager.") == 0 &&
        subject.user == "clex") {
        return polkit.Result.YES;
    }
});
EOF
chmod 0600 /etc/polkit-1/rules.d/10-network-manager.rules
chown polkitd:polkitd /etc/polkit-1/rules.d/10-network-manager.rules
echo "Completed network manager setup." >> /root/ks_post_install.log
%end

%addon com_redhat_kdump --enable --reserve-mb='auto'
%end
